# Deploy (docs/CI_CD.md). Started by hand: Actions -> Deploy -> Run workflow, type "deploy", Run workflow.
# It deploys the newest commit on main, and only if CI passed on that commit: migrations on the Supabase project, then
# that exact commit on Render, then it waits until the commit is live and smoke-tests it.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type deploy to deploy the newest commit on main
        type: string
        required: true
      environment:
        description: Which environment
        type: choice
        options: [production, staging]
        default: production
      skip_migrations:
        description: Skip migrations (redeploying an older commit; migrations only move forward)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    # Runs before any secret is loaded: the typed word, the branch, and CI's result for this exact commit.
    name: Ready to deploy?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      checks: read
    steps:
      - name: Typed "deploy", from main, CI passed
        env:
          CONFIRM: ${{ inputs.confirm }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(echo "$CONFIRM" | tr '[:upper:]' '[:lower:]' | xargs)" != "deploy" ]; then
            echo "::error::Type deploy in the confirm box to deploy."; exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Deploys run from main only. In Run workflow, leave 'Use workflow from' as main."; exit 1
          fi
          result=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=CI%20passed" \
            --jq '[.check_runs[] | .conclusion // .status] | first // "missing"')
          case "$result" in
            success) echo "CI passed on ${GITHUB_SHA:0:7}." ;;
            queued|in_progress|pending|waiting|requested)
              echo "::error::CI is still running on ${GITHUB_SHA:0:7}. Wait for it to finish (Actions -> CI), then run Deploy again."; exit 1 ;;
            missing)
              echo "::error::No CI result for ${GITHUB_SHA:0:7}. CI runs on every push to main; wait for it, then run Deploy again."; exit 1 ;;
            *)
              echo "::error::CI did not pass on ${GITHUB_SHA:0:7} ($result). Fix it and push again; only commits that pass deploy."; exit 1 ;;
          esac

  deploy:
    name: ${{ inputs.environment }}
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # The environment holds this target's secrets and only accepts deploys from main.
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.APP_URL }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      APP_URL: ${{ vars.APP_URL }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check this environment is configured
        run: |
          missing=""
          for v in APP_URL SUPABASE_PROJECT_REF SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD RENDER_DEPLOY_HOOK_URL; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::The '${{ inputs.environment }}' environment is missing:$missing. See docs/DEPLOY.md, step 3."
            exit 1
          fi

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        if: ${{ !inputs.skip_migrations }}
        with:
          version: "3.0.0"

      - name: Migrations to apply
        if: ${{ !inputs.skip_migrations }}
        run: supabase db push --remote="$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --skip-vault --dry-run

      - name: Apply migrations (the deploy stops here if one fails)
        if: ${{ !inputs.skip_migrations }}
        run: supabase db push --remote="$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --skip-vault --yes

      - name: Deploy this exact commit on Render
        run: |
          code=$(curl -sS -o render-response.txt -w '%{http_code}' -X POST "${RENDER_DEPLOY_HOOK_URL}&ref=${GITHUB_SHA}")
          echo "Render answered $code"
          if [ "${code:0:1}" != 2 ]; then
            echo "::error::Render refused the deploy ($code). 404 usually means the commit isn't on the service's branch; check the hook URL secret."
            exit 1
          fi

      - name: Wait until it is live, then smoke-test
        run: scripts/ci/wait-for-deploy.sh "$APP_URL" "$GITHUB_SHA" 30

      - name: Summary
        if: always()
        run: |
          {
            echo "### ${{ inputs.environment }}: ${{ job.status }}"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Started by: ${{ github.actor }}"
            echo "- URL: ${APP_URL}"
            echo "- Migrations: ${{ inputs.skip_migrations && 'skipped' || 'applied' }}"
          } >> "$GITHUB_STEP_SUMMARY"
